name: APK Android

# Compila un APK de prueba (debug) envolviendo la web con Capacitor.
# En main lo publica como release "apk-beta" con un enlace fijo de descarga.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copiar la web a www/
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js icon-192.png icon-512.png routes-data.js vendor www/
          # Comprobar que cada script o estilo local que pide index.html está dentro de la APK
          for f in $(grep -oE '(src|href)="[^":#?]+\.(js|css)"' index.html | sed -E 's/.*="([^"]+)"/\1/'); do
            [ -f "www/$f" ] || { echo "Falta $f en www/"; exit 1; }
          done

      - name: Instalar Capacitor y crear el proyecto Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Permisos de ubicación, versión e icono
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          # Icono de las notificaciones (silueta blanca; Android lo tiñe de lima)
          mkdir -p android/app/src/main/res/drawable && cp android-ci/ic_stat_zancada.png android/app/src/main/res/drawable/ic_stat_zancada.png
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"0.58.${{ github.run_number }}\"/" "$G"
          R=android/app/src/main/res
          rm -rf "$R/mipmap-anydpi-v26"
          for d in "$R"/mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f "$d/$f" ] && cp icon-192.png "$d/$f"
            done
          done
          # GPS en segundo plano (servicio en primer plano): icono, color y nombre de la notificación
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">Grabación de carreras</string>\n    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_zancada</string>\n    <string name="capacitor_background_geolocation_notification_color">#D4F53C</string>\n</resources>#' "$S"
          grep -q background-geolocation android/capacitor.settings.gradle || { echo "::error::Falta el plugin de GPS en segundo plano"; exit 1; }
          cat "$M" "$S"

      - name: Compilar APK
        env:
          ZANCADA_KEYSTORE_B64: ${{ secrets.ZANCADA_KEYSTORE_B64 }}
        run: |
          # Clave de firma fija para que cada APK nuevo se instale encima del anterior.
          # Vive en el Secret ZANCADA_KEYSTORE_B64 (base64), nunca en el repo.
          if [ -z "$ZANCADA_KEYSTORE_B64" ]; then
            echo "::error::Falta el Secret ZANCADA_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"; exit 1
          fi
          mkdir -p ~/.android && echo "$ZANCADA_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../zancada-beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zancada-beta-apk
          path: zancada-beta.apk

      - name: Publicar release apk-beta
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-beta --yes --cleanup-tag || true
          gh release create apk-beta zancada-beta.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Zancada beta (Android) · build ${{ github.run_number }}" \
            --notes "APK de prueba compilado desde main ($GITHUB_SHA). Descarga zancada-beta.apk en el móvil e instálalo."
