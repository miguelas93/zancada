# Dependabot: revisa cada semana si alguna dependencia tiene un fallo de seguridad conocido o una versión nueva
# y abre UN PR por carpeta con todo junto (para no llenar la lista). Las pruebas deciden si se puede fusionar.
# Las alertas y parches de seguridad llegan siempre, aunque la actualización sea grande.
version: 2
updates:
  - package-ecosystem: npm          # Capacitor y plugins de la beta (web empaquetada, congelada: sin saltos de versión grande)
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      beta: { patterns: ["*"] }
  - package-ecosystem: npm          # Playwright de las pruebas
    directory: /tests
    schedule: { interval: weekly }
    groups:
      pruebas: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gradle       # app nativa en Kotlin
    directory: /nativa
    schedule: { interval: weekly }
    groups:
      nativa: { patterns: ["*"] }
