# Dependabot: revisa cada semana si alguna dependencia tiene un fallo de seguridad conocido o una versión nueva
# y abre un PR para actualizarla. Las pruebas de tests/ deciden si se puede fusionar.
version: 2
updates:
  - package-ecosystem: npm          # Capacitor y plugins del APK
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # Playwright de las pruebas
    directory: /tests
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
